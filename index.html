<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>El camino que vuelve a casa — Ciclo euleriano</title>
<style>
:root{--ink:#f4f7fb;--muted:#aebed2;--cyan:#49e0d0;--yellow:#ffd166;--pink:#ff6584;--line:#2c3b52}
*{box-sizing:border-box}body{margin:0;background:#050914;color:var(--ink);font-family:system-ui,'Segoe UI',sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
.frame{width:min(1100px,96vw);aspect-ratio:16/9;background:radial-gradient(ellipse at 76% 33%,#132640,#0a1221 48%,#080d18);border:1px solid #26364c;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 24px 90px #0009}
.top{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #ffffff10;color:var(--muted);font:12px monospace;letter-spacing:.08em}.brand{color:var(--cyan)}
.stage{position:absolute;inset:49px 0 118px;padding:25px 6%;display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--cyan);font:12px monospace;letter-spacing:.16em;text-transform:uppercase;margin:0 0 12px}.title{font-size:clamp(30px,5vw,62px);line-height:1.04;letter-spacing:-.05em;margin:0}.lead{font-size:clamp(15px,1.9vw,20px);line-height:1.5;color:#c0cde0;max-width:800px;margin:15px 0 0}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center}.graph{width:100%;max-height:360px;overflow:visible}.edge{stroke:#34445e;stroke-width:3;stroke-linecap:round;transition:stroke .25s,opacity .25s}.edge.used{stroke:var(--cyan);stroke-width:5;filter:drop-shadow(0 0 6px #49e0d077)}.edge.current{stroke:var(--yellow);stroke-width:7}.node circle{fill:#111d30;stroke:#91a4be;stroke-width:2}.node text{fill:var(--ink);font:700 18px system-ui;text-anchor:middle;dominant-baseline:central}.node.active circle{stroke:var(--yellow);stroke-width:4;filter:drop-shadow(0 0 7px #ffd16688)}.side h2{font-size:clamp(21px,2.8vw,32px);margin:0 0 10px}.side p{font-size:clamp(13px,1.45vw,16px);line-height:1.5;color:#bdcadc;margin:0}.code{margin-top:14px;background:#080f1c;border:1px solid #26364c;border-radius:9px;padding:12px 15px;font:clamp(11px,1.2vw,14px)/1.8 monospace;color:#d5dfed}.ok{color:var(--cyan)}.hl{color:var(--yellow)}.stack,.checks{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0}.chip{border:1px solid #39516b;background:#132239;padding:6px 10px;border-radius:7px;font:12px monospace}.chip.topchip{border-color:var(--yellow);color:var(--yellow)}.route{color:var(--cyan)!important;font:600 clamp(13px,1.45vw,17px) monospace!important;overflow-wrap:anywhere;margin-top:10px!important}.small{font-size:12px!important;color:var(--muted)!important}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#132c2b;color:var(--cyan);font:11px monospace;margin-top:10px}.stats{display:flex;gap:26px;margin-top:16px}.stats b{font:700 27px monospace;color:var(--cyan)}.stats span{display:block;color:var(--muted);font-size:12px}.controls{position:absolute;bottom:0;left:0;right:0;height:118px;border-top:1px solid #ffffff12;background:#080d18ee;padding:12px 26px 15px}.caption{height:48px;display:grid;place-items:center;text-align:center;font-size:clamp(13px,1.5vw,17px);font-weight:600;line-height:1.3;padding:0 4%;text-shadow:0 2px 12px #000}.controlrow{display:flex;align-items:center;gap:12px;margin-top:6px}.play{background:var(--cyan);color:#061119;border:0;border-radius:7px;padding:8px 15px;font-weight:800;cursor:pointer}.seek{height:6px;flex:1;background:#253249;border-radius:9px;overflow:hidden;cursor:pointer}.fill{height:100%;width:0;background:var(--cyan)}.time{color:var(--muted);font:11px monospace;min-width:98px;text-align:right}.sound{background:none;border:1px solid #35465e;color:var(--muted);border-radius:7px;padding:7px 10px;cursor:pointer;font:12px monospace}
/* Simulaci?n de la pila durante la ejecuci?n comentada. */
.stack-demo{margin:10px 0 8px}.stack-label{display:flex;justify-content:space-between;align-items:center;gap:8px}.stack-operation{color:var(--cyan);font:700 11px monospace}.stack-operation.pop{color:var(--pink)}.stack-track{position:relative;min-height:62px;display:flex;align-items:center;gap:5px;padding:10px;border:1px solid #39516b;border-radius:9px;background:#080f1c;overflow:hidden}.stack-track:before{content:'BASE';color:var(--muted);font:9px monospace;margin-right:3px}.stack-track .chip{min-width:29px;text-align:center;padding:7px 6px}.stack-track .chip.topchip{box-shadow:0 0 12px #ffd16644}.stack-track .enter{animation:stackEnter .7s ease-out both}.stack-track .leave{animation:stackLeave .8s ease-in both;border-color:var(--pink);color:var(--pink)}.stack-hint{margin-top:4px;color:var(--muted);font:10px monospace;text-align:right}.stack-empty{color:var(--muted);font:11px monospace}@keyframes stackEnter{from{opacity:0;transform:translateX(30px) scale(.7)}to{opacity:1;transform:translateX(0) scale(1)}}@keyframes stackLeave{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(35px) scale(.7)}}
@media(max-width:700px){.stage{padding:14px 4%;inset:44px 0 115px}.layout{gap:8px;grid-template-columns:1fr}.graph{max-height:205px}.side p{font-size:12px}.side h2{font-size:20px}.code{padding:7px}.top{height:44px;padding:0 13px}.controls{height:115px;padding:9px 12px}.caption{height:48px}}
</style></head><body><main class="frame">
<header class="top"><span class="brand">ALGORITMOS · GRAFOS</span><span>01 / CICLOS EULERIANOS</span></header><section class="stage" id="stage"></section>
</main>
<script>
const D=280;
const graph=`<svg class="graph" viewBox="0 0 520 360" role="img" aria-label="Grafo de cinco vértices y seis aristas identificadas"><g>${[[125,180,250,70],[250,70,375,180],[375,180,125,180],[125,180,250,290],[250,290,375,290],[375,290,125,180]].map((p,i)=>`<line class="edge" data-edge="${i}" x1="${p[0]}" y1="${p[1]}" x2="${p[2]}" y2="${p[3]}"/>`).join('')}</g><g fill="#aebed2" font-family="monospace" font-size="13" font-weight="700"><text x="172" y="113">e1</text><text x="315" y="113">e2</text><text x="245" y="202">e3</text><text x="163" y="246">e4</text><text x="310" y="278">e5</text><text x="282" y="232">e6</text></g>${[['A',125,180],['B',250,70],['C',375,180],['D',250,290],['E',375,290]].map(([n,x,y])=>`<g class="node" data-node="${n}"><circle cx="${x}" cy="${y}" r="23"/><text x="${x}" y="${y}">${n}</text></g>`).join('')}</svg>`;
const scenes=[
{a:0,b:15,html:`<p class="eyebrow">Un recorrido con una regla</p><h1 class="title">El camino que<br>vuelve a casa</h1><p class="lead">Ciclo euleriano y algoritmo de Hierholzer</p><p class="lead small">Proyecto audiovisual · Implementación en C++</p>`},
{a:15,b:38,html:`<p class="eyebrow">01 · Concepto</p><h1 class="title">Cada arista,<br>una sola vez.</h1><p class="lead">El ciclo euleriano resuelve el problema de recorrer todas las conexiones de un grafo sin repetir ninguna arista y regresar al origen. Los vértices sí pueden repetirse.</p>`},
{a:38,b:66,html:`<p class="eyebrow">02 · Antes de buscar</p><div class="layout"><div>${graph}</div><div class="side"><h2>¿Puede existir?</h2><p>Revisamos dos condiciones: los vértices que tienen aristas están conectados entre sí y todos sus grados son pares.</p><div class="code"><span class="ok">A: 4</span> · B: 2 · C: 2<br>D: 2 · E: 2<br>6 aristas · 5 vértices activos</div><p class="small">El grado cuenta cuántas aristas tocan al vértice.</p></div></div>`},
{a:66,b:126,html:`<p class="eyebrow">03 · Cómo funciona Hierholzer</p><div class="layout"><div class="side"><h2 id="algTitle">Primero: inicia</h2><div class="code" id="algText"></div></div><div>${graph}</div></div>`},
{a:126,b:196,html:`<p class="eyebrow">04 · Ejecución comentada</p><div class="layout"><div>${graph}</div><div class="side"><h2 id="action">Inicio</h2><p id="desc"></p><div class="stack-demo"><div class="stack-label"><span class="small">Pila ? tope a la derecha</span><span class="stack-operation" id="stackOperation"></span></div><div class="stack-track" id="stack" aria-label="Contenido de la pila"></div><div class="stack-hint">BASE ? TOPE</div></div><div class="small">Resultado temporal (orden de salida)</div><p class="route" id="out"></p><p class="small">Aristas marcadas: <b id="count">0 / 6</b></p></div></div>`},
{a:196,b:226,html:`<p class="eyebrow">05 · Verificación del ciclo</p><div class="layout"><div>${graph}</div><div class="side"><h2>Resultado invertido</h2><p class="route">A → B → C → A → D → E → A</p><div class="code"><span class="ok">Inicio = fin:</span> A = A ✓<br><span class="ok">Pasos:</span> 7 vértices − 1 = 6 aristas ✓<br><span class="ok">IDs usados:</span> e1 e2 e3 e4 e5 e6<br>ninguno repetido y ninguno falta ✓</div><p class="small">La implementación también verifica grados, conectividad y consumo de todas las aristas.</p></div></div>`},
{a:226,b:246,html:`<p class="eyebrow">06 · Caso borde</p><div class="layout"><div style="display:grid;place-items:center"><svg viewBox="0 0 180 180" width="170"><circle cx="90" cy="90" r="28" fill="#111d30" stroke="#49e0d0" stroke-width="3"/><text x="90" y="96" fill="white" text-anchor="middle" font-size="20">A</text></svg></div><div class="side"><h2>Grafo sin aristas</h2><p>Con un vértice y cero aristas, el algoritmo devuelve el recorrido trivial [A]. No existe ningún tramo que recorrer. El código adopta esta convención.</p><span class="pill">E = 0 · resultado: A</span></div></div>`},
{a:246,b:272,html:`<p class="eyebrow">07 · Complejidad</p><h1 class="title">Lineal en el grafo.</h1><div class="stats"><div><b>O(V + E)</b><span>tiempo</span></div><div><b>O(V + E)</b><span>espacio total</span></div></div><p class="lead">V = vértices; E = aristas. Revisar grados y conectividad cuesta O(V+E); Hierholzer procesa cada arista una vez. Pila, resultado, marcadores y listas ocupan O(V+E).</p>`},
{a:272,b:280,html:`<p class="eyebrow">Fin · Gracias</p><h1 class="title">Todas las aristas.<br>Un solo ciclo.</h1><p class="lead small">Integrantes: Jose Manuel Timana Carmona · Alondra Solange Obregon Carhuavilca · Josue Yeremi Huaman Huamani</p>`}
];
// Cada estado de esta traza coincide con una frase narrada y una acción visual.
const run=[
['Iniciar','La pila comienza con A.',['A'],[],[]],
['Tomar e1: A–B','Marco e1 como usada y apilo B.',['A','B'],[],[0]],
['Tomar e2: B–C','Marco e2 como usada y apilo C.',['A','B','C'],[],[0,1]],
['Tomar e3: C–A','Regreso a A por e3. A aún tiene aristas libres.',['A','B','C','A'],[],[0,1,2]],
['Tomar e4: A–D','No cierro aquí: A tiene e4 sin usar; continúo por D.',['A','B','C','A','D'],[],[0,1,2,3]],
['Tomar e5: D–E','Marco e5 y apilo E.',['A','B','C','A','D','E'],[],[0,1,2,3,4]],
['Tomar e6: E–A','Marco e6 y cierro el recorrido en A.',['A','B','C','A','D','E','A'],[],[0,1,2,3,4,5]],
['Retroceder: A','A no tiene aristas libres. Lo añado al resultado y desapilo.',['A','B','C','A','D','E'],['A'],[0,1,2,3,4,5]],
['Retroceder: E','Añado E al resultado al desapilar.',['A','B','C','A','D'],['A','E'],[0,1,2,3,4,5]],
['Retroceder: D','Añado D al resultado.',['A','B','C','A'],['A','E','D'],[0,1,2,3,4,5]],
['Retroceder: A','Añado A al resultado.',['A','B','C'],['A','E','D','A'],[0,1,2,3,4,5]],
['Retroceder: C','Añado C al resultado.',['A','B'],['A','E','D','A','C'],[0,1,2,3,4,5]],
['Retroceder: B','Añado B al resultado.',['A'],['A','E','D','A','C','B'],[0,1,2,3,4,5]],
['Pila vacía','Añado el A inicial. Invierto este resultado para obtener el ciclo.',[''],['A','E','D','A','C','B','A'],[0,1,2,3,4,5],'Añado el A inicial. Pila vacía; invierto la lista para el circuito.']
];
const algBeats=[
{title:'1 · Condiciones necesarias',text:'<b>Antes de ejecutar:</b> todos los grados deben ser pares y los vértices con aristas deben estar en una sola componente conexa. Si falla una condición, no existe ciclo euleriano.'},
{title:'2 · Explorar una arista',text:'<b>Inicialización:</b> apilar un vértice de partida.<br><b>Mientras el tope tenga una arista no usada:</b> marcar su ID y apilar el otro extremo. Cada arista se marca una sola vez.'},
{title:'3 · Llegar a un callejón',text:'Si el tope ya no tiene aristas libres, <b>no lo descartamos:</b> lo añadimos al circuito y lo desapilamos. Esto registra el orden de retorno.'},
{title:'4 · Incorporar todos los ciclos',text:'Si quedan aristas, la pila conserva vértices por explorar. El retroceso visita sus salidas pendientes y las inserta en el mismo recorrido. Al vaciar la pila, invertimos el resultado.'}
];
const sequence=[
...scenes.slice(0,3).map((s,scene)=>({scene})),
...algBeats.map((beat,index)=>({scene:3,beat:index})),
...run.map((step,index)=>({scene:4,step:index})),
...scenes.slice(5).map((s,index)=>({scene:index+5}))
];
let lastScene=-1;const stage=document.getElementById('stage');
function displayEvent(index){const ev=sequence[index];if(!ev)return;const scene=scenes[ev.scene];if(lastScene!==ev.scene){stage.innerHTML=scene.html;lastScene=ev.scene}
 if(ev.scene===3){const beat=algBeats[ev.beat];document.getElementById('algTitle').textContent=beat.title;document.getElementById('algText').innerHTML=beat.text}
 if(ev.scene===4){const [title,desc,stack,out,used]=run[ev.step];document.getElementById('action').textContent=title;document.getElementById('desc').textContent=desc;const items=stack.filter(Boolean), previous=ev.step?run[ev.step-1][2].filter(Boolean):[], isPop=ev.step>0&&items.length<previous.length, vertex=isPop?previous.at(-1):items.at(-1), operation=document.getElementById('stackOperation'), stackEl=document.getElementById('stack');operation.textContent=isPop?`DESAPILAR ${vertex} ? RESULTADO`:`APILAR ${vertex}`;operation.classList.toggle('pop',isPop);stackEl.innerHTML=items.map((x,j)=>`<span class="chip ${j===items.length-1?'topchip':''} ${!isPop&&j===items.length-1?'enter':''}">${x}</span>`).join('')+(isPop?`<span class="chip leave" aria-hidden="true">${vertex}</span>`:'')+(!items.length?'<span class="stack-empty">Vac?a</span>':'');document.getElementById('out').textContent=out.join(' → ')||'—';document.getElementById('count').textContent=`${used.length} / 6`;document.querySelectorAll('.edge').forEach((e,j)=>{e.classList.toggle('used',used.includes(j));e.classList.toggle('current',used.length>0&&j===used[used.length-1])});document.querySelectorAll('.node').forEach(n=>n.classList.toggle('active',n.dataset.node===(stack.filter(Boolean).at(-1)||'')))}
 if(ev.scene===5)document.querySelectorAll('.edge').forEach(e=>{e.classList.add('used');e.classList.remove('current')});
}
</script></body></html>
